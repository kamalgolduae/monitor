name: Website Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: website-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check and push results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            python check_and_update.py

            git add status_log.txt index.html alert_state.json
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi

            git commit -m "Update monitor status"

            if git push; then
              echo "Pushed successfully"
              break
            fi

            echo "Push rejected (remote moved on), resetting to latest and retrying (attempt $i)"
            git reset --hard HEAD~1
            git fetch origin master
            git reset --hard origin/master
          done
